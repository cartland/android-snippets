name: Review PR with Gemini

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review_with_gemini:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Check the PR diff using the current branch and the base branch of the PR
      - uses: GrantBirki/git-diff-action@v2.8.0
        id: git-diff-action
        with:
          json_diff_file_output: diff.json
          raw_diff_file_output: diff.txt
          file_output_only: "true"

      # Print the diff in JSON format
      - name: print json diff
        env:
          DIFF: ${{ steps.git-diff-action.outputs.json-diff-path }}
        run: cat $DIFF

      # Print the diff in raw git format
      - name: print raw diff
        env:
          DIFF: ${{ steps.git-diff-action.outputs.raw-diff-path }}
        run: cat $DIFF

      - name: Make Gemini API Request and Save Result
        env:
          DIFF: ${{ steps.git-diff-action.outputs.raw-diff-path }}
        run: |
          API_KEY="${{ secrets.GEMINI_API_KEY }}"
          DIFF_CONTENT=$(cat "$DIFF")
          escaped_content=$(echo "$DIFF_CONTENT" | sed 's/\\/\\\\/g; s/"/\\"/g')
          JSON_PAYLOAD="{\"contents\": [{\"parts\": [{\"text\": \"Summarize the diff in one line: \n$escaped_content\"}]}]}"
          cat $JSON_PAYLOAD > gemini_request.json
          curl "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=$API_KEY" \
            -H 'Content-Type: application/json' \
            -X POST \
            -d "$JSON_PAYLOAD" > gemini_result.json

      # - name: Upload Gemini Request as Artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: gemini-request
      #     path: gemini_request.json

      - name: Upload Gemini Result as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-result
          path: gemini_result.json

      # - name: Extract Gemini Answer
      #   run: |
      #     GEMINI_ANSWER=$(jq '.candidates[0].content.parts[0].text' gemini_result.json)
      #     echo "GEMINI_ANSWER=$GEMINI_ANSWER" >> $GITHUB_ENV

