name: Review PR with Gemini

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review_with_gemini:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get Git Diff
        id: get_diff
        run: |
          diff=$(git diff HEAD~1 HEAD)
          echo "DIFF<<EOF" >> $GITHUB_OUTPUT
          echo "$diff" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Call Gemini API and Comment
        id: gemini_review
        run: |
          DIFF="${{ steps.get_diff.outputs.DIFF }}"
          if [[ -z "$DIFF" ]]; then
            echo "No diff found. Skipping Gemini review."
            echo "gemini_response=No diff to review." >> $GITHUB_OUTPUT
          else
            API_KEY="${{ secrets.GEMINI_API_KEY }}"
            JSON_PAYLOAD='{"contents": [{"parts": [{"text": "Explain how AI works"}]}]}'

            GEMINI_RESPONSE=$(curl "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=$API_KEY" \
              -H 'Content-Type: application/json' \
              -X POST \
              -d "$JSON_PAYLOAD")

            echo "gemini_response=$(echo "$GEMINI_RESPONSE" | jq -r '.candidates[0].content.parts[0].text')" >> $GITHUB_OUTPUT
          fi

      - name: Post Gemini Comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.gemini_review.outputs.gemini_response }}
